[platformio]
default_envs = soundbar

[env]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
custom_version = 0.1.0
custom_ota_repo = davidvancl/smart-speaker
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DOTA_REPO=\"${this.custom_ota_repo}\"

[env:soundbar]
board_build.app_partition_name = app0
board_upload.offset_address = 0x130000
build_src_filter = +<*> -<updater/>
build_flags =
    ${env.build_flags}
    -DFW_VERSION=\"${this.custom_version}\"
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.0
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.2
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.8
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    bblanchon/ArduinoJson @ 7.4.3
    makuna/NeoPixelBus @ 2.8.4
    adafruit/Adafruit BME280 Library @ 2.2.4
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4
    claws/BH1750 @ 1.3.0
    madhephaestus/ESP32Encoder @ 0.11.8
    mathertel/OneButton @ 2.6.1
    https://github.com/davidvancl/esp-ota-updater.git#v1.1.1

[env:updater]
board_build.app_partition_name = factory
board_upload.offset_address = 0x10000
build_src_filter = -<*> +<updater/>
build_flags =
    ${env.build_flags}
    -DFW_VERSION=\"0.0.0\"
lib_deps =
    https://github.com/davidvancl/esp-ota-updater.git#v1.1.1
    makuna/NeoPixelBus @ 2.8.4
